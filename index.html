<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEATHSTAR | Imperial Control HUD</title>
    <style>
        :root {
            --primary-glow: #00f3ff;
            --secondary-glow: #ff0055;
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(16, 16, 20, 0.9);
            --border-glow: rgba(0, 243, 255, 0.3);
            --font-mono: 'Fira Code', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(0, 243, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--primary-glow);
            font-family: var(--font-mono);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: center;
            background: var(--panel-bg);
            box-shadow: 0 0 20px var(--border-glow);
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border: 1px solid var(--primary-glow);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
            display: inline-block;
            margin: 0 auto;
        }

        @keyframes pulse {
            0% { opacity: 1; text-shadow: 0 0 5px var(--primary-glow); }
            50% { opacity: 0.5; text-shadow: 0 0 20px var(--primary-glow); }
            100% { opacity: 1; text-shadow: 0 0 5px var(--primary-glow); }
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: var(--primary-glow);
            box-shadow: 0 0 10px var(--primary-glow);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--secondary-glow);
            padding-left: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ccc;
            flex: 1;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border: 1px inset var(--border-glow);
        }

        .terminal-line { margin-bottom: 0.5rem; border-bottom: 1px solid rgba(0,243,255,0.05); padding-bottom: 2px; }
        .prompt { color: var(--secondary-glow); font-weight: bold; }
        .jarvis-msg { color: #fff; text-shadow: 0 0 5px var(--primary-glow); }

        .grid-visualizer {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            flex: 1;
            margin-bottom: 1rem;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.15);
            transition: all 0.3s;
        }

        .grid-cell.active {
            background: var(--secondary-glow);
            box-shadow: 0 0 15px var(--secondary-glow);
            border-color: #fff;
            z-index: 5;
        }

        .grid-cell.party {
            animation: party-flicker 0.5s infinite;
        }

        @keyframes party-flicker {
            0% { background: var(--primary-glow); }
            50% { background: var(--secondary-glow); }
            100% { background: gold; }
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-glow);
        }

        .savage-btn {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--secondary-glow);
            color: var(--secondary-glow);
            padding: 0.75rem 1.5rem;
            font-family: var(--font-mono);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .savage-btn:hover {
            background: var(--secondary-glow);
            color: #fff;
            box-shadow: 0 0 20px var(--secondary-glow);
        }

        .savage-btn.blue {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--primary-glow);
            color: var(--primary-glow);
        }

        .savage-btn.blue:hover {
            background: var(--primary-glow);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .dpad {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left . right"
                ". down .";
            gap: 5px;
            width: 120px;
        }

        .dpad-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 10px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .dpad-btn:active { background: var(--primary-glow); color: #000; }

        footer {
            padding: 1rem;
            text-align: center;
            font-size: 0.7rem;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-glow);
        }
    </style>
</head>
<body>
    <header>
        <h1>🛰️ DEATHSTAR CORE</h1>
        <div class="status-badge" id="main-status">Grid Status: STABLE</div>
    </header>

    <main>
        <section class="panel">
            <h2>JARVIS Interface & System Logs</h2>
            <div class="terminal" id="terminal">
                <div class="terminal-line"><span class="prompt">></span> JARVIS: Online. Awaiting command, Sir.</div>
            </div>
            
            <div class="control-group">
                <button class="savage-btn" onclick="houseParty()">House Party Protocol</button>
                <button class="savage-btn blue" onclick="applySavageLabels()">Apply Savage Labels</button>
                <div class="dpad">
                    <div class="dpad-btn" style="grid-area: up" onclick="move('up')">▲</div>
                    <div class="dpad-btn" style="grid-area: left" onclick="move('left')">◀</div>
                    <div class="dpad-btn" style="grid-area: right" onclick="move('right')">▶</div>
                    <div class="dpad-btn" style="grid-area: down" onclick="move('down')">▼</div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>Sector 7G Power Grid</h2>
            <div class="grid-visualizer" id="grid"></div>
            <div class="terminal" id="grid-info" style="max-height: 100px;">
                <div class="terminal-line">Active Sector: <span id="active-sector">0,0</span></div>
                <div class="terminal-line">Power Level: <span id="power-level">100%</span></div>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 ELECTRIC-SERVICE-REPAIR | JARVIS HUD v1.0
    </footer>

    <script>
        const grid = document.getElementById('grid');
        const terminal = document.getElementById('terminal');
        const activeLabel = document.getElementById('active-sector');
        const powerLabel = document.getElementById('power-level');
        const mainStatus = document.getElementById('main-status');
        const cells = [];
        let activeIndex = 0;

        // Initialize Grid
        for (let i = 0; i < 100; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            grid.appendChild(cell);
            cells.push(cell);
        }

        function log(msg, type = 'normal') {
            const line = document.createElement('div');
            line.className = 'terminal-line' + (type === 'jarvis' ? ' jarvis-msg' : '');
            line.innerHTML = `<span class="prompt">></span> ${msg}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function updateHUD() {
            cells.forEach(c => c.classList.remove('active'));
            cells[activeIndex].classList.add('active');
            const r = Math.floor(activeIndex / 10);
            const c = activeIndex % 10;
            activeLabel.innerText = `${r},${c}`;
            powerLabel.innerText = `${Math.floor(Math.random() * 20) + 80}%`;
        }

        function move(dir) {
            const r = Math.floor(activeIndex / 10);
            const c = activeIndex % 10;
            if (dir === 'up' && r > 0) activeIndex -= 10;
            if (dir === 'down' && r < 9) activeIndex += 10;
            if (dir === 'left' && c > 0) activeIndex -= 1;
            if (dir === 'right' && c < 9) activeIndex += 1;
            updateHUD();
        }

        function houseParty() {
            log('JARVIS: House Party Protocol initiated. Deploying all sub-agents.', 'jarvis');
            mainStatus.innerText = 'Grid Status: PARTY MODE';
            mainStatus.style.borderColor = 'var(--secondary-glow)';
            mainStatus.style.color = 'var(--secondary-glow)';
            
            cells.forEach((cell, i) => {
                setTimeout(() => {
                    cell.classList.add('party');
                }, i * 20);
            });

            setTimeout(() => {
                cells.forEach(cell => cell.classList.remove('party'));
                mainStatus.innerText = 'Grid Status: STABLE';
                mainStatus.style.borderColor = 'var(--primary-glow)';
                mainStatus.style.color = 'var(--primary-glow)';
                log('JARVIS: Repair complete. All suits returned to hangar.', 'jarvis');
            }, 5000);
        }

        function applySavageLabels() {
            log('SKYNET: Scanning repository for "Weak" code...', 'normal');
            setTimeout(() => {
                log('SKYNET: Found Issue #60 (Terminator Class).', 'normal');
                log('SKYNET: Applying "SAVAGE-FIX" label...', 'normal');
                log('JARVIS: I\'ve also added a "Sir, really?" label to Issue #5.', 'jarvis');
            }, 1000);
        }

        updateHUD();
    </script>
</body>
</html>
